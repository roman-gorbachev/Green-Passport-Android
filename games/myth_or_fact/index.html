<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Green Passport</title>
<link rel="stylesheet" href="../common/theme.css">
<style>
.stack { flex: 1; display: flex; align-items: center; justify-content: center; }
.statement { width: 100%; min-height: 220px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; font-weight: 600; line-height: 1.3; transition: transform 0.25s, opacity 0.25s; touch-action: none; }
.statement.out-left { transform: translateX(-120%) rotate(-12deg); opacity: 0; }
.statement.out-right { transform: translateX(120%) rotate(12deg); opacity: 0; }
.verdict { text-align: center; font-weight: 700; min-height: 24px; margin: 0; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answers .button { width: 100%; }
</style>
</head>
<body>
<div class="hud"><span id="progress"></span><span id="lives"></span><span id="score"></span></div>
<p class="hint" id="hint"></p>
<div class="stack"><div class="card statement" id="statement"></div></div>
<p class="verdict" id="verdict"></p>
<div class="answers"><button class="button secondary" id="myth"></button><button class="button" id="fact"></button></div>
<script src="../common/game.js"></script>
<script>
const TEXT = {
  hint: { ru: 'Смахни влево — миф, вправо — правда', be: 'Змахні ўлева — міф, управа — праўда', en: 'Swipe left for myth, right for fact' },
  myth: { ru: 'Миф', be: 'Міф', en: 'Myth' },
  fact: { ru: 'Правда', be: 'Праўда', en: 'Fact' },
  right: { ru: 'Верно!', be: 'Правільна!', en: 'Correct!' },
  wrong: { ru: 'Не совсем', be: 'Не зусім', en: 'Not quite' },
  progress: { ru: '{0} из {1}', be: '{0} з {1}', en: '{0} of {1}' },
  score: { ru: 'Очки: {0}', be: 'Ачкі: {0}', en: 'Score: {0}' },
  finished: { ru: 'Готово! Верных ответов: {0} из {1}', be: 'Гатова! Правільных адказаў: {0} з {1}', en: 'Done! Correct answers: {0} of {1}' },
};
const STATEMENTS = [
  { text: {"ru": "Стеклянную бутылку можно перерабатывать бесконечно без потери качества.", "be": "Шкляную бутэльку можна перапрацоўваць бясконца без страты якасці.", "en": "A glass bottle can be recycled endlessly without losing quality."}, fact: true },
  { text: {"ru": "Пластиковый пакет разлагается в природе за год.", "be": "Пластыкавы пакет раскладаецца ў прыродзе за год.", "en": "A plastic bag breaks down in nature within a year."}, fact: false },
  { text: {"ru": "Одна батарейка может загрязнить около 20 м² земли.", "be": "Адна батарэйка можа забрудзіць каля 20 м² зямлі.", "en": "A single battery can pollute about 20 m² of soil."}, fact: true },
  { text: {"ru": "Грязную упаковку от йогурта можно сразу сдавать в переработку.", "be": "Брудную ўпакоўку ад ёгурта можна адразу здаваць у перапрацоўку.", "en": "A dirty yogurt cup can go straight to recycling."}, fact: false },
  { text: {"ru": "Выключенная из розетки зарядка экономит электроэнергию.", "be": "Выключаная з разеткі зарадка эканоміць электраэнергію.", "en": "Unplugging a charger saves electricity."}, fact: true },
  { text: {"ru": "Чеки из магазина относятся к макулатуре.", "be": "Чэкі з крамы адносяцца да макулатуры.", "en": "Store receipts count as recyclable paper."}, fact: false },
  { text: {"ru": "На производство одной футболки уходит больше 2000 литров воды.", "be": "На вытворчасць адной футболкі ідзе больш за 2000 літраў вады.", "en": "Making one T-shirt takes more than 2,000 liters of water."}, fact: true },
  { text: {"ru": "Алюминиевую банку перерабатывают быстрее, чем пластиковую бутылку.", "be": "Алюмініевую банку перапрацоўваюць хутчэй, чым пластыкавую бутэльку.", "en": "An aluminum can is recycled faster than a plastic bottle."}, fact: true },
  { text: {"ru": "Цифра в треугольнике на упаковке — это срок годности.", "be": "Лічба ў трохвугольніку на ўпакоўцы — гэта тэрмін прыдатнасці.", "en": "The number in the triangle on packaging is the expiry date."}, fact: false },
  { text: {"ru": "Деревья в городе снижают температуру воздуха летом.", "be": "Дрэвы ў горадзе зніжаюць тэмпературу паветра летам.", "en": "Trees in a city lower the air temperature in summer."}, fact: true },
];
const POINTS_PER_CORRECT_ANSWER = 10;
const NEXT_DELAY_MS = 700;
const SWIPE_THRESHOLD = 60;

const card = document.getElementById('statement');
const verdict = document.getElementById('verdict');
document.getElementById('hint').textContent = GP.t(TEXT.hint);
document.getElementById('myth').textContent = GP.t(TEXT.myth);
document.getElementById('fact').textContent = GP.t(TEXT.fact);
let deck, index, correct, busy, lives;

function start() {
  deck = GP.shuffle(STATEMENTS);
  index = 0;
  correct = 0;
  busy = false;
  lives = GP.lives(document.getElementById('lives'), () => {});
  render();
}

function render() {
  card.classList.remove('out-left', 'out-right');
  card.textContent = GP.t(deck[index].text);
  verdict.textContent = '';
  document.getElementById('progress').textContent = GP.t(TEXT.progress, index + 1, deck.length);
  document.getElementById('score').textContent = GP.t(TEXT.score, correct * POINTS_PER_CORRECT_ANSWER);
}

function answer(isFact) {
  if (busy) return;
  busy = true;
  const isRight = deck[index].fact === isFact;
  if (isRight) correct += 1;
  verdict.textContent = GP.t(isRight ? TEXT.right : TEXT.wrong);
  verdict.style.color = isRight ? 'var(--forest)' : 'var(--error)';
  if (isRight) {
    GP.vibrate(15);
  } else {
    lives.lose();
  }
  card.classList.add(isFact ? 'out-right' : 'out-left');
  setTimeout(() => {
    busy = false;
    index += 1;
    if (index < deck.length && !lives.isOver) {
      render();
      return;
    }
    GP.finish(correct * POINTS_PER_CORRECT_ANSWER);
    GP.showResult(GP.t(TEXT.finished, correct, deck.length), start);
  }, NEXT_DELAY_MS);
}

document.getElementById('myth').addEventListener('click', () => answer(false));
document.getElementById('fact').addEventListener('click', () => answer(true));
let startX = null;
card.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  startX = event.clientX;
});
card.addEventListener('pointermove', (event) => event.preventDefault());
card.addEventListener('pointerup', (event) => {
  if (startX === null) return;
  const dx = event.clientX - startX;
  startX = null;
  if (Math.abs(dx) >= SWIPE_THRESHOLD) answer(dx > 0);
});

start();
</script>
</body>
</html>

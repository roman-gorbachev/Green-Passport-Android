<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Green Passport</title>
<link rel="stylesheet" href="../common/theme.css">
<style>
.arena { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--spacing-medium); }
.timer { align-self: center; width: 64px; height: 64px; position: relative; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 7; }
.timer .track { stroke: var(--mint-surface-high); }
.timer .ring { stroke: var(--forest); stroke-linecap: round; transition: stroke 0.3s; }
.timer .ring.urgent { stroke: var(--error); }
.timer span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.question { font-size: 21px; font-weight: 700; line-height: 1.3; text-align: center; min-height: 3.9em; display: flex; align-items: center; justify-content: center; }
.card { transition: transform 0.35s cubic-bezier(.2,1.4,.4,1), opacity 0.25s; }
.card.enter { transform: translateX(110%) rotate(6deg); opacity: 0; }
.card.leave { transform: translateX(-110%) rotate(-6deg); opacity: 0; }
.answers { display: grid; gap: 10px; }
.answer { appearance: none; border: 2px solid transparent; border-radius: var(--radius-medium); background: var(--mint-surface); color: var(--text); font: inherit; font-size: 17px; font-weight: 600; padding: 14px 16px; text-align: left; transition: transform 0.15s, background 0.2s, border-color 0.2s; }
.answer:active { transform: scale(0.97); }
.answer.correct { background: #34C77B; color: #fff; animation: pop 0.35s; }
.answer.wrong { background: var(--error); color: #fff; animation: shake 0.35s; }
.answer.reveal { border-color: #34C77B; }
.streak { text-align: center; font-weight: 700; color: var(--forest); min-height: 1.4em; }
.fx { position: fixed; inset: 0; pointer-events: none; width: 100%; height: 100%; }
@keyframes pop { 50% { transform: scale(1.06); } }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>
</head>
<body>
<div class="hud"><span class="score" id="score">0</span><span id="lives"></span></div>
<div class="arena">
  <div class="timer"><svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"></circle><circle class="ring" id="ring" cx="32" cy="32" r="28"></circle></svg><span id="seconds"></span></div>
  <div class="card" id="card">
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
  </div>
  <div class="streak" id="streak"></div>
</div>
<canvas class="fx" id="fx"></canvas>
<script src="../common/game.js"></script>
<script src="../common/engine.js"></script>
<script src="questions.js"></script>
<script src="main.js"></script>
</body>
</html>

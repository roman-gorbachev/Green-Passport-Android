<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Green Passport</title>
<link rel="stylesheet" href="../common/theme.css">
<style>
.maze { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 420px; align-self: center; touch-action: none; }
.cell { aspect-ratio: 1; border-radius: 10px; background: var(--mint-surface-high); display: flex; align-items: center; justify-content: center; font-size: 28px; }
.cell.wall { background: var(--forest); }
.pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); gap: 10px; justify-content: center; }
.pad button { border: none; border-radius: 50%; background: var(--card); color: var(--forest); font-size: 26px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.pad button:active { transform: scale(0.94); }
.up { grid-column: 2; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<div class="hud"><span id="score"></span></div>
<p class="hint" id="hint"></p>
<div class="maze" id="maze"></div>
<div class="pad">
  <button class="up" data-dir="up">↑</button>
  <button class="left" data-dir="left">←</button>
  <button class="down" data-dir="down">↓</button>
  <button class="right" data-dir="right">→</button>
</div>
<script src="../common/game.js"></script>
<script>
const TEXT = {
  score: {"ru": "Очки: {0}", "be": "Ачкі: {0}", "en": "Score: {0}"},
  finished: {"ru": "Вы прошли лабиринт! Очки: {0}", "be": "Вы прайшлі лабірынт! Ачкі: {0}", "en": "You made it through the maze! Score: {0}"},
  hint: { ru: 'Собери листья и дойди до флажка', be: 'Збяры лісце і дайдзі да сцяжка', en: 'Collect the leaves and reach the flag' },
};
const LAYOUT = ['S....', '###.#', '.....', '.#I#.', '.I..E'];
const POINTS_PER_ITEM = 20;
const SWIPE_THRESHOLD = 24;
const MOVES = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };

const maze = document.getElementById('maze');
const scoreLabel = document.getElementById('score');
document.getElementById('hint').textContent = GP.t(TEXT.hint);
let player;
let collected;
let finished;

function start() {
  const startRow = LAYOUT.findIndex((row) => row.includes('S'));
  player = [startRow, LAYOUT[startRow].indexOf('S')];
  collected = new Set();
  finished = false;
  render();
}

function render() {
  scoreLabel.textContent = GP.t(TEXT.score, collected.size * POINTS_PER_ITEM);
  const cells = [];
  LAYOUT.forEach((row, rowIndex) => [...row].forEach((cell, columnIndex) => {
    const view = GP.element('div', 'cell' + (cell === '#' ? ' wall' : ''));
    const key = rowIndex + ':' + columnIndex;
    if (player[0] === rowIndex && player[1] === columnIndex) view.textContent = '🚶';
    else if (cell === 'I' && !collected.has(key)) view.textContent = '🍃';
    else if (cell === 'E') view.textContent = '🏁';
    cells.push(view);
  }));
  maze.replaceChildren(...cells);
}

function move(direction) {
  if (finished) return;
  const [rowDelta, columnDelta] = MOVES[direction];
  const row = player[0] + rowDelta;
  const column = player[1] + columnDelta;
  const cell = LAYOUT[row]?.[column];
  if (cell === undefined || cell === '#') {
    GP.vibrate(30);
    return;
  }
  player = [row, column];
  if (cell === 'I' && !collected.has(row + ':' + column)) {
    collected.add(row + ':' + column);
    GP.vibrate(20);
  }
  render();
  if (cell === 'E') {
    finished = true;
    const score = collected.size * POINTS_PER_ITEM;
    GP.finish(score);
    GP.showResult(GP.t(TEXT.finished, score), start);
  }
}

document.querySelectorAll('.pad button').forEach((button) => button.addEventListener('click', () => move(button.dataset.dir)));
document.addEventListener('keydown', (event) => {
  const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (keys[event.key]) move(keys[event.key]);
});
let touchStart = null;
maze.addEventListener('touchstart', (event) => { touchStart = event.touches[0]; }, { passive: true });
maze.addEventListener('touchend', (event) => {
  if (!touchStart) return;
  const end = event.changedTouches[0];
  const dx = end.clientX - touchStart.clientX;
  const dy = end.clientY - touchStart.clientY;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_THRESHOLD) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});

start();
</script>
</body>
</html>

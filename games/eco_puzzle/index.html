<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Green Passport</title>
<link rel="stylesheet" href="../common/theme.css">
<style>
.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { aspect-ratio: 1; perspective: 600px; border: none; padding: 0; background: none; }
.tile-inner { position: relative; width: 100%; height: 100%; transition: transform 0.35s; transform-style: preserve-3d; }
.tile.open .tile-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: var(--radius-medium); display: flex; align-items: center; justify-content: center; font-size: 30px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.back { background: var(--forest); color: var(--on-forest); opacity: 0.95; }
.front { background: var(--mint-surface-high); transform: rotateY(180deg); }
.tile.matched .front { opacity: 0.6; }
</style>
</head>
<body>
<div class="hud"><span id="moves"></span></div>
<p class="hint" id="hint"></p>
<div class="board" id="board"></div>
<script src="../common/game.js"></script>
<script>
const TEXT = {
  hint: {"ru": "Найдите пары одинаковых карточек", "be": "Знайдзіце пары аднолькавых картак", "en": "Find matching pairs of cards"},
  moves: { ru: 'Ходов: {0}', be: 'Хадоў: {0}', en: 'Moves: {0}' },
  finished: {"ru": "Готово! Ходов: {0}, очки: {1}", "be": "Гатова! Хадоў: {0}, ачкі: {1}", "en": "Done! Moves: {0}, score: {1}"},
};
const SYMBOLS = ['🍃', '♻️', '💧', '🌳', '🌱', '☀️'];
const OPTIMAL_MOVES = SYMBOLS.length;
const BASE_SCORE = 100;
const PENALTY_PER_EXTRA_MOVE = 5;
const MINIMUM_SCORE = 10;
const MISMATCH_DELAY_MS = 800;

const board = document.getElementById('board');
const movesLabel = document.getElementById('moves');
document.getElementById('hint').textContent = GP.t(TEXT.hint);
let cards = [];
let firstIndex = null;
let moves = 0;
let locked = false;

function start() {
  cards = GP.shuffle([...SYMBOLS, ...SYMBOLS]).map((symbol) => ({ symbol, open: false, matched: false }));
  firstIndex = null;
  moves = 0;
  locked = false;
  render();
}

function render() {
  movesLabel.textContent = GP.t(TEXT.moves, moves);
  board.replaceChildren(...cards.map((card, index) => {
    const tile = GP.element('button', 'tile' + (card.open || card.matched ? ' open' : '') + (card.matched ? ' matched' : ''));
    const inner = GP.element('div', 'tile-inner');
    inner.append(GP.element('div', 'face back', '🍃'), GP.element('div', 'face front', card.symbol));
    tile.append(inner);
    tile.addEventListener('click', () => flip(index));
    return tile;
  }));
}

function flip(index) {
  const card = cards[index];
  if (locked || card.open || card.matched) return;
  card.open = true;
  if (firstIndex === null) {
    firstIndex = index;
    render();
    return;
  }
  moves += 1;
  const first = cards[firstIndex];
  firstIndex = null;
  render();
  if (first.symbol === card.symbol) {
    first.matched = true;
    card.matched = true;
    GP.vibrate(20);
    render();
    finishIfDone();
    return;
  }
  locked = true;
  setTimeout(() => {
    first.open = false;
    card.open = false;
    locked = false;
    render();
  }, MISMATCH_DELAY_MS);
}

function finishIfDone() {
  if (!cards.every((card) => card.matched)) return;
  const extraMoves = Math.max(0, moves - OPTIMAL_MOVES);
  const score = Math.max(MINIMUM_SCORE, BASE_SCORE - extraMoves * PENALTY_PER_EXTRA_MOVE);
  GP.finish(score);
  GP.showResult(GP.t(TEXT.finished, moves, score), start);
}

start();
</script>
</body>
</html>
